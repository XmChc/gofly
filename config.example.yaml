# 复制为 config.yaml 后修改
# 推荐只用飞猪 MTOP API；ctrip/qunar 需 Playwright 且易被风控

platforms:
  - fliggy

schedule:
  # 单位秒，可直接改；最短 300。实际触发为 interval±jitter，并穿插随机单航线探测
  interval_seconds: 5400
  jitter_seconds: 1200
  run_on_start: false

crawler:
  headless: true
  timeout_seconds: 50
  delay_min: 4
  delay_max: 10
  debug: false
  debug_dir: debug
  user_data_dir: user_data
  max_attempts: 5
  fliggy_max_poll: 4
  rate_limit: true

server:
  host: 127.0.0.1
  port: 8787

database:
  path: data/gofly.db

# 低价推送（多渠道，改 channel 即可切换）
# spt/wxpusher | serverchan | pushplus | email
# token 前缀可自动识别：SPT_ → WxPusher，SCT → Server酱
notify:
  enabled: false
  channel: spt
  token: ""  # SPT_xxx 或 SCT... 等；email 通道可留空
  # --- 邮件（推荐 QQ 邮箱 + 微信「QQ邮箱提醒」）---
  # channel: email
  # smtp_host: smtp.qq.com
  # smtp_port: 465          # 465=SSL，587=STARTTLS
  # smtp_user: "你的QQ@qq.com"
  # smtp_pass: "邮箱授权码"  # 非登录密码；QQ邮箱→设置→账户→开启SMTP→生成授权码
  # mail_to: "你的QQ@qq.com"

seed_routes:
  - origin: 厦门
    destination: 乌鲁木齐
    depart_date: "2026-09-20"
    alert_threshold: 800
  - origin: 喀什
    destination: 南昌
    depart_date: "2026-09-25"
    alert_threshold: 900
