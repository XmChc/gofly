<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoFly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=49" />
  <script src="/static/vendor/echarts.min.js?v=5.5.1"></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✈</span>
      <div>
        <strong class="brand-name">GoFly</strong>
        <span class="brand-sub">国内机票监控</span>
      </div>
    </div>
    <div class="topbar-meta">
      <span id="health" class="status">连接中…</span>
      <span id="lastRun" class="status soft">上次检测 —</span>
      <label class="status soft interval-pick">
        扫描频率
        <input
          id="scanInterval"
          type="number"
          min="300"
          step="1"
          inputmode="numeric"
          aria-label="扫描频率（秒）"
          title="单位秒，最少 300"
        />
        <span class="interval-unit">s</span>
      </label>
      <button id="btnScanAll" class="btn primary" type="button">扫描全部</button>
    </div>
  </header>

  <main class="page">
    <section class="sheet add-sheet">
      <form id="addForm" class="add-form">
        <div class="field">
          <label for="origin">出发城市</label>
          <input id="origin" name="origin" list="cityList" placeholder="例如 厦门" required autocomplete="off" />
          <span id="originHint" class="hint-live">输入城市名</span>
        </div>
        <div class="swap" aria-hidden="true">→</div>
        <div class="field">
          <label for="destination">到达城市</label>
          <input id="destination" name="destination" list="cityList" placeholder="例如 乌鲁木齐" required autocomplete="off" />
          <span id="destHint" class="hint-live">输入城市名</span>
        </div>
        <datalist id="cityList"></datalist>
        <div class="field date-field">
          <label for="depart_date_display">出发日期</label>
          <div class="date-picker" id="datePicker">
            <button type="button" class="date-trigger" id="depart_date_display" aria-haspopup="dialog" aria-expanded="false">
              <span class="date-trigger-text">选择日期</span>
              <span class="date-trigger-icon" aria-hidden="true">📅</span>
            </button>
            <input id="depart_date" name="depart_date" type="hidden" />
            <input id="depart_date_end" name="depart_date_end" type="hidden" />
            <div class="date-popover" id="datePopover" hidden role="dialog" aria-label="选择出发日期范围">
              <div class="date-pop-head">
                <button type="button" class="date-nav" data-nav="-1" aria-label="上个月">‹</button>
                <div class="date-title" id="dateTitle">2026年8月</div>
                <button type="button" class="date-nav" data-nav="1" aria-label="下个月">›</button>
              </div>
              <p class="date-range-hint" id="dateRangeHint">点击选择开始日，再点结束日</p>
              <div class="date-weekdays">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
              </div>
              <div class="date-grid" id="dateGrid"></div>
              <div class="date-pop-foot">
                <button type="button" class="date-quick" data-quick="7">一周后</button>
                <button type="button" class="date-quick" data-quick="14">两周后</button>
                <button type="button" class="date-quick" data-quick="21">三周后</button>
                <button type="button" class="date-quick" data-quick="30">一个月后</button>
              </div>
            </div>
          </div>
          <span class="hint-live">范围算一组监控，扫描时按天取价</span>
        </div>
        <button type="submit" class="btn primary add-btn">+ 添加监控</button>
      </form>
    </section>

    <section class="sheet" id="alertSheet" hidden>
      <div class="sheet-head">
        <h2>降价提醒</h2>
      </div>
      <div id="alertList" class="alert-list"></div>
    </section>

    <div class="workspace" id="monitorPanel">
      <aside class="sidebar" id="routesSheet">
        <div class="sheet-head">
          <h2>监控航线</h2>
          <div class="route-batch" id="routeBatchBar">
            <button type="button" class="batch-pill" id="btnSelectAllRoutes">全选</button>
            <button type="button" class="batch-pill danger" id="btnBatchDelete" hidden>删除所选</button>
          </div>
        </div>
        <div id="routeList" class="route-list"></div>
      </aside>

      <section class="main-col detail-sheet" id="detail" hidden>
        <div class="detail-sticky-top">
          <div class="sheet-title-block">
            <h2 id="detailTitle">航线详情</h2>
            <p id="detailSub" class="sheet-sub">
              <span id="detailOd"></span>
              <span class="detail-sub-sep">·</span>
              <button type="button" id="detailDateBtn" class="detail-date-btn" title="点击修改出发日期范围">选择日期</button>
            </p>
          </div>
          <div class="fb-filters sticky-filters" id="fbFilters" hidden></div>
        </div>
        <div class="sheet-actions">
          <label class="alert-limit-field" title="空或 0 表示不按限额过滤推送">
            提醒限额
            <span class="alert-limit-input">
              <span class="alert-limit-prefix">¥</span>
              <input
                id="alertThreshold"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="不限制"
              />
            </span>
          </label>
          <button id="btnToggle" class="btn ghost" type="button">暂停监控</button>
          <button id="btnDelete" class="btn danger" type="button">删除</button>
          <button id="btnScanOne" class="btn primary" type="button">重新扫描</button>
        </div>

        <div class="trend-card">
          <div class="trend-head">
            <h3 class="block-title">价格趋势</h3>
            <div class="trend-controls">
              <div class="seg" id="rangeSeg">
                <button type="button" data-days="1" class="seg-btn">24时</button>
                <button type="button" data-days="7" class="seg-btn active">7天</button>
                <button type="button" data-days="30" class="seg-btn">30天</button>
                <button type="button" data-days="" class="seg-btn">全部</button>
              </div>
            </div>
          </div>
          <div id="trendStats" class="trend-stats"></div>
          <div id="platformFilter" class="plats filter-row"></div>
          <div id="trendChart" class="chart"></div>
        </div>

        <h3 class="block-title">当前报价</h3>
        <div id="compareTable" class="compare"></div>

        <div id="recommendBoard" class="rec-board" hidden></div>

        <div class="flights-card">
          <div class="flights-head">
            <h3 class="block-title">航班明细</h3>
          </div>
          <div id="offerTable" class="flight-board"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div id="flightTrendModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-trend-modal></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="flightTrendModalTitle">
      <div class="modal-head">
        <h3 id="flightTrendModalTitle">航班价格走势</h3>
        <button type="button" class="modal-close" data-close-trend-modal aria-label="关闭">×</button>
      </div>
      <div id="flightTrendModalChart" class="chart modal-chart"></div>
    </div>
  </div>

  <div id="notifyGroupModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-notify-modal></div>
    <div class="modal-dialog notify-dialog" role="dialog" aria-modal="true" aria-labelledby="notifyGroupTitle">
      <div class="modal-head">
        <div>
          <h3 id="notifyGroupTitle">推送接收组</h3>
          <p id="notifyGroupSub" class="modal-sub"></p>
        </div>
        <button type="button" class="modal-close" data-close-notify-modal aria-label="关闭">×</button>
      </div>
      <div class="notify-modal-body">
        <p id="notifyGroupHint" class="notify-hint"></p>
        <div id="notifyEmailChips" class="notify-chips"></div>
        <form id="notifyEmailForm" class="notify-add-row">
          <input id="notifyEmailInput" type="email" placeholder="添加接收邮箱，例如 you@example.com" autocomplete="email" />
          <button type="submit" class="btn">添加</button>
        </form>
        <p class="notify-tip">留空则使用全局默认邮箱。仅邮件推送通道生效。</p>
      </div>
      <div class="notify-modal-foot">
        <button type="button" class="btn" id="btnTestNotifyGroup">测试推送</button>
        <div class="notify-modal-foot-actions">
          <button type="button" class="btn" data-close-notify-modal>取消</button>
          <button type="button" class="btn primary" id="btnSaveNotifyGroup">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-confirm-modal></div>
    <div class="modal-dialog confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="modal-head">
        <h3 id="confirmModalTitle">确认删除</h3>
        <button type="button" class="modal-close" data-close-confirm-modal aria-label="关闭">×</button>
      </div>
      <p id="confirmModalMsg" class="confirm-msg"></p>
      <div class="confirm-modal-foot">
        <button type="button" class="btn" id="btnConfirmCancel" data-close-confirm-modal>取消</button>
        <button type="button" class="btn danger" id="btnConfirmOk">删除</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=49"></script>
</body>
</html>
