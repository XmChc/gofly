# 绿联 / Docker Hub 用法：
# 1. 复制本文件旁的 config.example.yaml 为 config.yaml，按需改 notify / seed_routes
# 2. 把下方 image 改成你的 Docker Hub 仓库名
# 3. docker compose up -d
#
# 本机构建并推送：
#   .\scripts\push-docker.ps1
#
# 绿联「快捷访问」：系统靠 ports 字段发现服务端口。
# - Bridge（默认）：ports 既做真实映射，也用于生成快捷入口 → 推荐
# - Host：ports 映射无效，但仍须写 "8787:8787"（两端端口一致）供识别快捷入口
#   勿写成 "8888:8787"，绿联会识别失败

services:
  gofly:
    image: xmchc/gofly:latest
    # 本地调试可取消下一行注释，改为本地 build：
    # build: .
    container_name: gofly
    restart: unless-stopped
    # 默认 bridge；不要加 network_mode: host（除非你明确需要）
    ports:
      - "8787:8787"   # 宿主机:容器；绿联据此生成「快捷访问」
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      GOFLY_CONFIG: /app/config.yaml
      GOFLY_HOST: "0.0.0.0"
      GOFLY_PORT: "8787"
      TZ: Asia/Shanghai
